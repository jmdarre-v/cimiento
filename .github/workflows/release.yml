name: release

# On a version tag: build, test, pack, then install the packed tarball in a clean folder and use it
# the way a person would. This workflow never publishes; npm publish stays a person's step.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIMIENTO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: The tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, build and test
        run: |
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Install the tarball in a clean folder
        run: |
          mkdir -p "$RUNNER_TEMP/prefix"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/cimiento-*.tgz
          echo "$RUNNER_TEMP/prefix/bin" >> "$GITHUB_PATH"

      - name: cimiento --version is the tag
        run: test "v$(cimiento --version)" = "$GITHUB_REF_NAME"

      - name: A scaffolded project builds, and plan --json answers in it
        working-directory: ${{ runner.temp }}
        run: |
          cimiento new demo --preset designer --scaffold-only --json --dir demo
          cd demo
          npm install --no-audit --no-fund
          npm run build
          cimiento plan --json > plan.jsonl
          node -e "const lines = require('fs').readFileSync('plan.jsonl', 'utf8').trim().split('\n'); const plan = JSON.parse(lines[lines.length - 1]); if (plan.command !== 'plan' || !Array.isArray(plan.items) || plan.items.length === 0) process.exit(1)"

      - uses: actions/upload-artifact@v4
        with:
          name: cimiento-tarball
          path: ${{ runner.temp }}/cimiento-*.tgz
