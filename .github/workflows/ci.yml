name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build, test and install.sh --dry-run on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Service containers run on the Linux runner only; there the Neon migration tests run against
    # this PostgreSQL, and fail if the URL is missing (test/unit/postgres.test.ts).
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CIMIENTO_TEST_PG_URL: ${{ matrix.os == 'ubuntu-latest' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: install.sh --dry-run
        run: bash scripts/install.sh --dry-run

      - name: The built CLI answers
        run: |
          node dist/cli.js --version
          node dist/cli.js explain HOSTING_DOMAIN_DNS_NEEDED
