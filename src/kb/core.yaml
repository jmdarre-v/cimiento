- code: MANIFEST_INVALID
  provider: core
  title: stack.yaml does not pass validation
  signatures:
    - "is not valid"
    - "Unrecognized key"
  hint: Fix every field the message lists, then run cimiento plan again.
  fix: Compare stack.yaml with docs/SPEC.md section 4. The message names each field and the rule it broke.

- code: MANIFEST_NOT_FOUND
  provider: core
  title: no stack.yaml in this folder
  signatures:
    - "No stack.yaml in"
  hint: Run cimiento init here, or cimiento new <name> to create a project folder.
  fix: cimiento only manages folders that declare what they need. init writes the declaration without touching your code.

- code: MANIFEST_UNKNOWN_PROVIDER
  provider: core
  title: a slot names a provider this build does not ship
  signatures:
    - "No provider module named"
  hint: Set that slot to none in stack.yaml, or upgrade cimiento.
  fix: This build ships github, vercel, supabase, inngest, turnstile and anthropic. resend, stripe and posthog arrive in a later release.

- code: PLAN_CYCLE
  provider: core
  title: two steps wait on each other
  signatures:
    - "Dependency cycle"
  hint: This is a bug in cimiento. Run cimiento plan --json and open an issue with the output.
  fix: Nothing to do in your project. The dependency graph a provider or wiring rule declares has a loop in it.

- code: PLAN_UNKNOWN_DEPENDENCY
  provider: core
  title: a step waits on something nothing produces
  signatures:
    - "which no provider or wiring rule produces"
  hint: This is a bug in cimiento. Run cimiento plan --json and open an issue with the output.
  fix: Nothing to do in your project. A provider declared a dependency on a resource id that is never emitted.
  seen: Goal 1 Part B, 2026-09-25. --only and --skip raised this whenever a kept step waited on a step of a filtered provider. Filtering now keeps the order among the kept steps and reads the filtered provider's values from state.

- code: DEFERRED_UNRESOLVED
  provider: core
  title: a value that only exists after an earlier step
  signatures:
    - "needs values that do not exist yet"
  hint: Run cimiento up so the earlier step produces the value, then run the command again.
  fix: The production URL exists only after the first deployment, and the Supabase keys only after the project is created. plan shows these as blocked, which is correct, not an error.

- code: STATE_UNREADABLE
  provider: core
  title: the state file is damaged
  signatures:
    - "Could not read"
  hint: Delete the state file and run cimiento plan again.
  fix: State is rebuilt by adoption. Everything that already exists is found by name and re-recorded, nothing is created twice.

- code: STATE_VERSION_UNSUPPORTED
  provider: core
  title: the state file comes from a newer cimiento
  signatures:
    - "this build understands version"
  hint: Upgrade cimiento, or delete the state file and let plan rebuild it.
  fix: Install the latest cimiento with npm install -g cimiento@latest, then run the same command again.

- code: SCAFFOLD_TARGET_EXISTS
  provider: scaffold
  title: the target folder is not empty
  signatures:
    - "already exists and is not empty"
  hint: Pick another name, or run cimiento init inside the folder you already have.
  fix: cimiento never writes over existing work. init adds stack.yaml to a project that is already started.

- code: SCAFFOLD_TEMPLATE_UNKNOWN
  provider: scaffold
  title: no such starter template
  signatures:
    - "No template named"
  hint: Use scaffold.template nextjs-app, designer-site, or none.
  fix: nextjs-app is the full app starter, designer-site is a site with a design/ folder for Claude Design exports, and none leaves your own code untouched.

- code: CHECK_FAILED
  provider: core
  title: a probe came back negative
  signatures:
    - "did not verify"
    - "cimiento expects 200"
  hint: Run cimiento doctor --json to see which item failed, then cimiento explain <resource>.
  fix: A check proves function, not existence. The message names the thing that could not be proved.

  seen: "Goal 6, 2026-10-18 (BUG-76). plan and doctor acted on the outside world: on the fullstack fixture they posted a Supabase SQL query, a Turnstile siteverify and an Inngest event, and on Resend, PostHog and Neon projects they sent an email, an event and SQL over HTTP. Every check now has a passive inspect that only reads; the checks that act run only under --smoke, which says what each does first. plan never acts."
- code: MANUAL_STEP_PENDING
  provider: core
  title: a step only a person can do
  signatures:
    - "has not been confirmed yet"
    - "still does not look done"
  hint: Run cimiento up in a terminal. It opens the page in your browser, waits for Enter, then checks the step really is done.
  fix: Accepting vendor terms and approving an integration cannot be automated. cimiento opens the page, waits, and proves the result with a probe before it continues. A step that already verifies is never asked for, and a step still waiting is asked once per run, not once per pass.
  seen: Goal 6, 2026-10-18 (BUG-75). doctor answered ok with confirmed earlier, recorded in manualDone, for a step whose live check failed, such as GitHub access revoked after it was granted, and plan called such a step done without probing it; a Vercel 5xx was reported as ok. doctor now reports ok, failed or unknown from the live check alone, resolved like every other item, and manualDone is history. Goal 3 close, 2026-10-17 (BUG-54). The plugin new-project skill could not run cimiento new, so it could not start the person steps either. It may now run cimiento new and cimiento up and open each step page, and it hands logins and secrets to the person terminal. Goal 3 close, 2026-10-17 (BUG-51 to 53). Account choices listed Name and Plan as fields although their pages have nothing to fill in; the GitHub step for Vercel carried two pages in one step; and the walk printed Press Enter to open it twice, once in the block and once as the prompt. Choices now list no fields, each page is its own step asked in turn in the same run, and the prompts alone say each Enter. Field test 2, 2026-10-17 (BUG-42). Person steps were spread through the run, so the person had to stay for all of it. An attended up now lists every person step first, runs them all before anything unattended, and then says the rest is unattended with an estimate in minutes. Field test 2, 2026-10-17 (BUG-41). Person steps were a sentence or two each, with links to copy by hand and the page opened before the person had read what to do. Every step (logins for Vercel, GitHub, Supabase and Cloudflare, the Vercel team, Supabase organization and Cloudflare account choices, the free limit, the Marketplace, GitHub access, the Inngest integration and every secret prompt) is now one PersonStep, in English and Spanish, with the full clickable link, Enter to open it, the clicks in order, each field with its value, the button, what success looks like, and Enter when done before the verify. Field test 2, 2026-10-17. The first unattended run of cimiento new cimiento-test-2 said cimiento had opened the Inngest and Marketplace pages in the browser, in a run with no terminal that opened nothing, and named the Vercel team by its id. Goal 1 Part B, 2026-09-25. The re-run of up in cimiento-test-1 reported each pending session twice, one per executor pass, which in a terminal would have repeated the question. The attended run then printed the Marketplace instructions twice, once from the event and once from the logger, and doctor failed the same step that plan showed as done because doctor never ran its verify.

- code: DOWN_CONFIRMATION_NEEDED
  provider: core
  title: cimiento down needs the project name typed back
  signatures:
    - "type the project name"
  hint: Run cimiento down in a terminal and type the project name when it asks, or pass --yes when you are sure.
  fix: down deletes real resources in real accounts, so it never runs on a single keypress. --yes skips the question for scripted cleanup such as field tests.
  seen: Goal 4, 2026-10-17 (BUG-57). After the private repository was renamed and a new public one took its name, up kept the state entry as noop, with no origin, so down would have deleted the new public repository as one cimiento created. A repository, Vercel project or Turnstile widget found under the recorded name with a different id is now adopted, and down keeps it.


- code: BILLING_APPROVAL_NEEDED
  provider: core
  title: the plan creates billable resources nobody approved
  signatures:
    - "can cost money"
    - "bills to"
  hint: Approve with --allow-billing, or run cimiento up in a terminal and answer the question.
  fix: Each billable item gets one warning naming the account or organization it bills to and that account's plan, with an explicit note when the plan is paid. The same database is one item, not two.
  seen: Field test 2, 2026-10-17 (BUG-44). The Supabase organization was asked after the plan was printed, so the billing line could not name it. Logins and account choices now come before the plan. Goal 1 Part B, 2026-09-25. plan printed every billing warning twice in two phrasings, counted the Marketplace install and the database it creates as two billable things, and never said whose account would pay. Then, with --allow-billing already on the command line, the warning still told the person to approve with --allow-billing; it now says the item is approved for this run.

- code: DOWN_LEFTOVER
  provider: core
  title: down left something it created but cannot delete
  signatures:
    - "cannot delete organizations"
    - "cannot delete or archive apps"
  hint: Delete it at the dashboard link down prints, when you no longer need it.
  fix: The Supabase Management API has no way to delete an organization, so down lists an organization cimiento created as a leftover with its dashboard link, keeps the record in state, and drops it once the organization is gone. The Inngest API cannot delete or archive an app either, so down lists the Inngest app in the run that removes its endpoint.
  seen: Goal 1 Part B, 2026-09-25. With organization creation offered in the account and free limit steps, down needed to account for organizations cimiento created. In the Goal 1 cleanup, down said nothing about the organization while the repository was waiting on the delete_repo permission; leftovers are now listed in every run.

- code: DEV_SERVICE_FAILED
  provider: core
  title: cimiento dev could not start a local service
  signatures:
    - "Docker is not running"
    - "stopped on its own"
    - "supabase start failed"
  hint: Read the line above it, which names the service. For the local database, Docker Desktop has to be running; cimiento dev opens it on a Mac and waits.
  fix: cimiento dev runs the local Supabase database on Docker, the Inngest dev server on port 8288 and the app on port 3000. When one stops, it stops the others so nothing is left running in the background.

- code: JOIN_NO_STATE
  provider: core
  title: there is nothing in this folder to join
  signatures:
    - "has no .cimiento/state.json"
  hint: Pull the latest commit of the repository, which carries .cimiento/state.json. If the project was never set up, run cimiento up instead.
  fix: join connects a new machine to resources that already exist, and state is the list of them. Without it there is nothing to verify; up is the command that creates them.

- code: HOSTING_PREVIEW_NOT_READY
  provider: core
  title: a pushed branch has no ready preview yet
  signatures:
    - "No ready preview for"
  hint: Wait a minute and run cimiento doctor again. If the state says error, open the build log of that preview in the hosting dashboard.
  fix: The hosting provider builds a preview for every pushed branch by itself. hosting.preview checks that each branch other than production has a ready preview of its latest commit, so a branch whose preview failed to build shows up here instead of in production.

- code: HOSTING_DOMAIN_FAILED
  provider: core
  title: the custom domain could not be added or removed
  signatures:
    - "to the Vercel project failed"
    - "is not a domain name cimiento can add"
    - "already has the domain"
  hint: Read the message; a domain belongs to one hosting project at a time, and stack.yaml keeps one custom domain per project.
  fix: cimiento domain add writes domain in stack.yaml, then applies only the items that follow it. cimiento domain remove undoes the same items.

- code: HOSTING_DOMAIN_DNS_NEEDED
  provider: core
  title: the domain's DNS does not point at the hosting yet
  signatures:
    - "but its DNS does not point there yet"
  hint: Add the one DNS record the message names where the domain's DNS is managed, then run cimiento doctor.
  fix: A subdomain needs a CNAME to the hosting. For Vercel it is the value Vercel recommends first for the project (a project specific name under vercel-dns, with cname.vercel-dns.com as the fallback), or a TXT record when Vercel first needs proof of ownership; for Netlify it is <site>.netlify.app. The DNS provider is the one place cimiento cannot reach, so this is a person step.
  seen: Field test 5, 2026-10-18 (BUG-64). On cimiento-test-5 the DNS step named cname.vercel-dns.com, while Vercel's domain config recommends a project specific CNAME first, and the step could not name a TXT challenge. It now reads Vercel's recommendation and its misconfigured flag, and names the TXT record when Vercel asks for one.

- code: HOSTING_DOMAIN_NOT_SERVING
  provider: core
  title: the domain points at the hosting but does not serve the site yet
  signatures:
    - "though its DNS points at"
  hint: Run cimiento doctor again in a few minutes; the https certificate is issued after DNS points at the hosting.
  fix: The check fetches https://<domain> and expects 200 with the cimiento scaffold marker.

- code: HTTP_TIMEOUT
  provider: core
  title: a provider did not answer in time
  signatures:
    - "got no answer within"
  hint: Check the network and the provider's status page, then run the command again. Reads were already retried; a write is never sent twice.
  fix: Every request cimiento makes has a bounded timeout, 30 s by default. A GET or HEAD is retried twice on a timeout, 429, 502, 503 or 504; a POST, PUT, PATCH or DELETE is never sent again, because it may have happened, and the next run reads the result before changing anything.
  seen: "Goal 6, 2026-10-18 (BUG-71). io.ts http had no timeout, so a provider that never answered left cimiento hanging forever; a request to a server that accepted the connection and never replied was still pending after 2 s with no end."

- code: HTTP_UNREACHABLE
  provider: core
  title: a provider could not be reached
  signatures:
    - "fetch failed"
    - "ENOTFOUND"
    - "ECONNREFUSED"
  hint: Check the network connection, a VPN or proxy, and the provider's status page, then run the command again.
  fix: Reads are retried twice before this is reported; writes are not retried.

- code: PROJECT_LOCKED
  provider: core
  title: another cimiento run is working on this project
  signatures:
    - "is working on this project"
  hint: Wait for the other run to finish, then run the command again.
  fix: One run per project at a time, so two runs never create the same thing or write state over each other. The lock is a file under ~/.cimiento/locks named after the project path, outside the project so git never sees it. A lock whose process is gone, left by a killed run, is reported as stale and taken over.
  seen: "Goal 6, 2026-10-18 (BUG-72). State was written only at the end of a run, so an up killed right after creating the Vercel project left no record; the next run adopted the project by name and down would never have deleted it. State is now written after every completed operation, to a temporary file renamed over the old one, under a project lock."

- code: DOWN_UNCONFIRMED
  provider: core
  title: down could not confirm a resource is gone
  signatures:
    - "could not confirm it is gone"
  hint: Run cimiento down again once the provider answers. It looks the resource up by its id and forgets it only when the provider says it is gone.
  fix: After every delete, down looks the resource up by the id state recorded. Present means it still exists; absent, an authenticated not found, is the only answer that lets down forget it; an auth error, a timeout or a provider error is unknown, so the record stays and the run exits non zero.
  seen: "Goal 6, 2026-10-18 (BUG-73). down treated any failed check after a delete as gone, through verify(...).catch(() => ({ ok: false })), so a 503, a revoked token or a timeout on the check made it forget a resource that might still exist and exit 0."

- code: ORPHANS_DECISION_NEEDED
  provider: core
  title: stack.yaml no longer selects resources cimiento still tracks
  signatures:
    - "no longer selects"
  hint: Run cimiento up --orphans retain, release or destroy, or run cimiento up in a terminal and choose.
  fix: When a slot is removed or filled by another provider, such as hosting changed from vercel to netlify, the old resources stay in state with the spec they were made with. plan lists them as orphan. up asks once, before changing anything; retain keeps tracking them and down deletes them later, release forgets them and leaves them where they are, destroy deletes them now and confirms each gone. down always deletes them.
  seen: "Goal 6, 2026-10-18 (BUG-74). After hosting changed from vercel to netlify in stack.yaml, plan did not mention the old Vercel project and down left it running and untracked, because both only looked at the specs stack.yaml selects. State, now version 2, records each resource's unresolved spec and the account it was made in."

