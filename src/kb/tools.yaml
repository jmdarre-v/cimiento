- code: TOOL_MISSING
  provider: core
  title: a required command line tool is not installed
  signatures:
    - "command not found"
    - "is not on PATH"
    - "ENOENT"
  hint: cimiento up installs the tool for you.
  fix: macOS installs come from Homebrew for git, gh and supabase, and from npm for the Vercel CLI.

- code: TOOL_VERSION_TOO_OLD
  provider: core
  title: the tool is installed but too old
  signatures:
    - "cimiento needs >="
  hint: cimiento up upgrades the tool for you with brew upgrade or npm, whichever installed it.
  fix: Old CLI versions change their json output shape, which is what cimiento reads. The range in the message is the minimum that has been tested. The version in the message is read from that tool itself.
  seen: Field test 2, 2026-10-17 (BUG-43). up asked about each outdated tool separately, in the middle of apply. It now asks once before the plan for every outdated tool, remembers a skipped version in machine state and offers only a newer one, never asks during apply, and doctor lists outdated tools without asking. Goal 1 Part A, 2026-09-25. doctor wrote one version per provider into machine.json, so git was recorded with the version of gh. Goal 1 attended run, 2026-09-25. The Supabase CLI was 2.95.4 with 2.118.0 available and cimiento said nothing. A newer version is now reported in plan and doctor, and up offers brew upgrade or npm install once, without blocking; a tool installed outside Homebrew and npm, such as Apple's git, is reported but never offered an upgrade cimiento cannot perform.

- code: TOOL_INSTALL_FAILED
  provider: core
  title: the install command failed
  signatures:
    - "Installing"
    - "brew: command not found"
  hint: The installer message in the error says what went wrong. cimiento up retries the install safely.
  fix: On a fresh Mac the usual cause is that Homebrew itself is missing. Install it from https://brew.sh first. On Ubuntu, also under WSL, install.sh first installs with apt what Homebrew needs (build-essential, procps, curl, file, git) and libsecret-tools for keychain secrets, asking for the sudo password once.
  seen: Goal 5, 2026-10-18 (BUG-58, BUG-59). install.sh --dry-run in an Ubuntu 24.04 container still ran curl to fetch the Homebrew installer, because the command substitution ran before the dry-run check, and its table said installed for everything it would only install. A dry run now names the Homebrew installer without fetching it, and the table says would be installed. Goal 5 CI, 2026-10-18 (BUG-65). The first GitHub Actions run failed on ubuntu-latest: the installer tests put /usr/bin on PATH, and the runner ships gh there, so gh counted as already installed. The tests now run with a folder of only the system utilities the script needs.

- code: SESSION_MISSING
  provider: core
  title: not logged in to the service
  signatures:
    - "Not logged in to"
    - "no credentials found"
    - "You must log in"
    - "Logged out."
  hint: Run cimiento up in a terminal. It opens the vendor login in your browser and waits while you approve it.
  fix: cimiento never asks for a password or a pasted token. Every login is the vendor browser or device flow, run in the foreground so its code and link are visible. In a --json or agent run with no terminal, cimiento does not start a login nobody can see; it stops with exit code 2 and this step pending.
  seen: Goal 3 close, 2026-10-17. A beginner may have no GitHub or Vercel account at all, which no login can fix. In a terminal cimiento now asks first, and walks the GitHub sign-up and the Vercel Hobby sign-up through Continue with GitHub as person steps, GitHub first. Goal 1 Part A, 2026-09-25. A missing session used to fail the run with exit code 1 and a hint telling the person to run the vendor login by hand.

- code: SESSION_ACCOUNT_MISMATCH
  provider: core
  title: logged in as the wrong account
  signatures:
    - "but stack.yaml pins"
    - "cannot reach the team"
  hint: Log in as the account stack.yaml pins, or run cimiento accounts set <provider> to pin the account you are logged in as.
  fix: This is the guard that stops a project being deployed into a personal account when it belongs to a team, or the other way round. It is deliberate, not a bug.
  seen: Goal 1 attended run, 2026-09-25. The project lived in the pinned Supabase organization, but the session reported the first organization the login could see, a paid one the project does not use. The session now reports the pinned organization, and verify fails when the login cannot access it.

- code: SESSION_LOGIN_FAILED
  provider: core
  title: the browser login did not finish
  signatures:
    - "auth login failed"
    - "login failed"
    - "still reports no account"
    - "Waiting for authentication"
    - "oauth/device?user_code="
    - "Cannot use automatic login flow inside non-TTY"
    - "Using workdir"
    - "Invalid authentication scope"
    - "Timed out waiting for authorization code"
  hint: Read the cause in the message, which comes from the vendor's own log, and do what the hint says for it; most often that is cimiento up again with the approval given within two minutes.
  fix: The browser window was closed, or the approval was not given. Retrying is safe. If the message contains a device code link or says Waiting for authentication, or mentions a non TTY environment, the login was run without the terminal attached, which is the Goal 1 Part A bug, fixed by running every login through io.interactive.
  seen: Field test 2, 2026-10-17 (BUG-47). Both attended Cloudflare logins of cimiento-test-2 failed at once with wrangler's Invalid authentication scope offline_access, before any browser opened, and cimiento reported only that the login did not finish. cimiento now runs a plain wrangler login, which grants challenge-widgets.write in wrangler 4, reads the real error from WRANGLER_LOG_PATH, and names wrangler's two minute approval window when that is the cause. Goal 1 Part A, 2026-09-25. vercel login printed its device code into captured output and was killed by the 120 second exec timeout before a delayed approval; supabase login refused its browser flow for lack of a TTY.

- code: ACCOUNT_CHOICE_NEEDED
  provider: core
  title: several accounts and none pinned
  signatures:
    - "does not say which one this project uses"
  hint: Run cimiento accounts set <provider> in a terminal and pick one, or pass --to with the id. The choice is written to stack.yaml, and state follows it.
  fix: The account decides who owns and who pays for what cimiento creates, so it is never guessed. With exactly one free option cimiento pins it without asking. The Supabase organization question shows each organization with its plan, warns on a paid one, and always offers to create a new organization, named after the project by default.
  seen: Goal 1 Part A, 2026-09-25. stack.yaml came out of cimiento new with no accounts.github and no accounts.vercel, and nothing asked for the Vercel team. Goal 1 Part B, 2026-09-25. There was no way to change a pinned account, because state kept its own copy of the Supabase organization. cimiento accounts set <provider> now asks again and re-pins, and state follows stack.yaml every time a project is opened.
