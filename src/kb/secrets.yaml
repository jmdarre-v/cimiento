- code: SECRET_SOURCE_UNAVAILABLE
  provider: secrets
  title: the declared secret source cannot be read right now
  signatures:
    - "Storing"
    - "1Password CLI (op) is not installed"
    - "1Password is locked or signed out"
  hint: Run cimiento up or cimiento secret set NAME in a terminal. cimiento installs the 1Password CLI, and the keychain or 1Password asks you to unlock it.
  fix: keychain secrets live under service cimiento, account <project>/<NAME>, written through security -i so the value never reaches a command line. 1password secrets are read with op read and the ref in stack.yaml. Both need an unlocked keychain or vault.

- code: SECRET_MISSING
  provider: secrets
  title: a declared secret has no value
  signatures:
    - "has no value for"
    - "is not set in the"
    - "No value for"
    - "cimiento has no value for"
  hint: Run cimiento up or cimiento secret set NAME in a terminal; both ask at a hidden prompt.
  fix: cimiento prompts with hidden input, pushes the value to every declared sink and keeps no copy. It never asks you to paste a key into a chat window, and it never invents one.
  seen: Field test 5, 2026-10-18 (BUG-62). On the Netlify project cimiento-test-5c, cimiento secret rotate ended with a note that Vercel reads env when it builds. The note now names the hosting the project uses, and says nothing about a rebuild when the secret has no hosting sink. Field test 2, 2026-10-17. Six pending steps for three keychain secrets each said run cimiento secret set NAME, without saying that it needs a terminal or that the value goes to the macOS keychain.

- code: SECRET_SINK_UNAVAILABLE
  provider: secrets
  title: a secret targets a destination this build cannot write to
  signatures:
    - "only writes to"
  hint: Remove that sink from the secret in stack.yaml, or upgrade cimiento.
  fix: This build writes to the hosting sink. The database and ci sinks arrive in a later release.

- code: SECRET_NOT_DECLARED
  provider: secrets
  title: stack.yaml does not declare that secret
  signatures:
    - "does not declare a secret named"
  hint: Use a name from the secrets section of stack.yaml, or add the secret there first with the sinks it belongs in.
  fix: A secret exists for a project only when its stack.yaml declares it. A secret only one project needs goes in that project's stack.yaml, never in a preset, and cimiento secret remove NAME takes one out of stack.yaml, the hosting env and the keychain in one step.
  seen: Field test 2, 2026-10-17 (BUG-40). The fullstack preset declared TYPESAFE_API_KEY and XPOZ_API_KEY, which SPEC section 4 only showed as an example from one specific project, so the attended up of cimiento-test-2 would have asked for two keys that project does not use. The preset now declares ANTHROPIC_API_KEY only, and cimiento secret remove took the other two out of cimiento-test-2.
