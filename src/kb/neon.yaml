- code: NEON_TOKEN_MISSING
  provider: neon
  title: no Neon token for the API
  signatures:
    - "could not find a Neon token"
  hint: cimiento up opens the Neon login in your browser. On a machine with no browser, set NEON_API_KEY in the environment.
  fix: neonctl keeps a short lived token and refreshes it on every command; cimiento runs neonctl me first when the stored one expired. Current neonctl keeps its login in ~/.config/neon/credentials.json, older releases in ~/.config/neonctl; cimiento reads both.
  seen: Field test 5, 2026-10-18 (BUG-67). After the person signed up and logged in with neonctl auth in the attended up of cimiento-test-5b, neon.project still failed with NEON_TOKEN_MISSING, because neonctl now writes ~/.config/neon and cimiento only read ~/.config/neonctl.

- code: NEON_API_ERROR
  provider: neon
  title: Neon returned an unexpected error
  signatures:
    - "Listing Neon projects failed"
    - "Creating the Neon project"
  hint: Read the Neon message in the error, then run cimiento doctor --json.
  fix: With a personal login, cimiento always names the organization in accounts.neon, because Neon lists and creates projects per organization. The key for previews, neon.api-key, is an organization API key scoped to the one project; a member of the organization can make it. When this machine's keychain no longer holds its value, cimiento up makes a new one, revokes the old one, and writes the new one to the Actions secret and the preview env.
  seen: "Goal 8, 2026-10-18 (BUG-102, BUG-96). Field test 8 showed a key scoped to one project gets 404 on GET /projects, not allowed outside the project it is scoped to, while it reads the project and its branches; the preview workflow failed with NEON_API_KEY reaches 0 Neon projects. NEON_PROJECT_ID now goes beside the key, to the Actions secrets and the preview env. Before that, The preview database workflow and the previews needed a Neon key nobody had: cimiento now makes one scoped to the project, keeps it as a generated secret and down revokes it."

- code: NEON_PROJECT_LIMIT
  provider: neon
  title: the Neon organization is at its project limit
  signatures:
    - "the organization is at its project limit"
  hint: Delete a Neon project you no longer need at https://console.neon.tech/app/projects, then run cimiento up again.
  fix: The Free plan allows a limited number of projects per organization. cimiento never deletes a project it did not create.

- code: NEON_MIGRATION_FAILED
  provider: neon
  title: a migration did not run on Neon
  signatures:
    - "failed on Neon"
    - "not applied yet"
    - "Querying public.cimiento_baseline on Neon failed"
  hint: Fix the SQL file the error names and run cimiento up again.
  fix: cimiento applies each file in db/migrations once, in name order, whole, through a Postgres client, in one implicit transaction with its record in cimiento_migrations. A file that fails leaves nothing behind.

- code: NEON_MIGRATION_HISTORY_UNREADABLE
  provider: neon
  title: the migration history exists but cannot be read
  signatures:
    - "exists but cannot be read"
  hint: Nothing was applied. Check that the role in the connection string can read public.cimiento_migrations, then run cimiento up again.
  fix: cimiento tells a history table that does not exist yet, which the first run creates, from one it cannot read, which stops the run, because applying every migration again on a database that already has them would break it.
  seen: "Goal 6, 2026-10-18 (BUG-77). Migrations were split at semicolons at line ends, which cut a dollar quoted function body into broken statements, and any error reading the history table was taken as no migrations yet. Each file now goes whole through a Postgres client, in one implicit transaction with its record."

